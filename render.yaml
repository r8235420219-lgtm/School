# render.yaml — optional Blueprint for one-click Render deploy
# Use this OR configure manually via the Render dashboard.

services:
  - type: web
    name: studyhub
    env: node
    region: oregon
    plan: free
    buildCommand: |
      curl -fsSL https://github.com/benbjohnson/litestream/releases/download/v0.3.13/litestream-v0.3.13-linux-amd64.tar.gz | tar -xz -C /usr/local/bin &&
      npm install
    startCommand: litestream replicate -config litestream.yml -exec "npm run start"
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: PUBLIC_URL
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: CLASS_CODE
        sync: false
      - key: ADMIN_NAME
        value: Teacher
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: ADMIN_TELEGRAM_IDS
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: DATA_DIR
        value: ./data
      - key: STORAGE_DIR
        value: /opt/render/project/src/storage
      - key: LITESTREAM_R2_BUCKET
        sync: false
      - key: LITESTREAM_R2_ACCOUNT_ID
        sync: false
      - key: LITESTREAM_R2_ACCESS_KEY_ID
        sync: false
      - key: LITESTREAM_R2_SECRET_ACCESS_KEY
        sync: false
    disk:
      name: storage
      mountPath: /opt/render/project/src/storage
      sizeGB: 1
